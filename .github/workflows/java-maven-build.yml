name: Java Maven Build Check

on:
  pull_request:
    branches:
      - 'profit_deployment_*'
    paths:
      - '**/*.java'

jobs:
  maven-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B
